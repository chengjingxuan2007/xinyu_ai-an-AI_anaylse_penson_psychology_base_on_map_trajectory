<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心语 AI - 情绪对话</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../common.css">
    <style>
        body { display: flex; height: 100vh; overflow: hidden; }

        /* 左侧栏：模式选择 */
        .chat-side {
            width: 240px; flex-shrink: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.5);
            padding: 1.5rem 1rem;
            display: flex; flex-direction: column; gap: 0.6rem;
        }

        .side-logo { font-size: 1.3rem; font-weight: bold; color: var(--secondary-color); margin-bottom: 1rem; }

        .mode-item {
            width: 100%; text-align: left;
            background: rgba(255, 255, 255, 0.6);
            border: none; border-radius: 12px;
            padding: 10px 14px; font-weight: bold;
            transition: all 0.25s;
        }

        .mode-item.active {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: #fff;
        }

        /* 右侧：聊天区 */
        .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        .chat-head {
            padding: 1rem 1.5rem;
            background: var(--bg-glass);
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .chat-body { flex: 1; overflow-y: auto; padding: 1.5rem; }

        .msg {
            max-width: 70%; margin-bottom: 1rem;
            padding: 0.8rem 1rem; border-radius: 14px;
            line-height: 1.6; white-space: pre-wrap;
        }

        .msg.user {
            margin-left: auto; color: #fff;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border-bottom-right-radius: 4px;
        }

        .msg.ai { background: #fff; box-shadow: var(--shadow); border-bottom-left-radius: 4px; }

        .chat-foot {
            padding: 1rem 1.5rem;
            background: var(--bg-glass);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body>
    <!-- 左侧：四个模式切换 -->
    <aside class="chat-side">
        <div class="side-logo">💜 心语</div>
        <button class="mode-item active" data-mode="normal">💬 普通模式</button>
        <button class="mode-item" data-mode="partner">💑 伴侣模式</button>
        <button class="mode-item" data-mode="classmate">🎓 同学模式</button>
        <button class="mode-item" data-mode="teacher">👨‍ 老师模式</button>
        <hr class="my-3">
        <a href="../main.html" class="btn btn-outline-primary btn-sm rounded-pill">← 返回主页</a>
    </aside>

    <!-- 右侧：聊天区 -->
    <div class="chat-main">
        <div class="chat-head">
            <h5 class="mb-0">情绪对话</h5>
            <small class="text-muted">我会感知你的情绪，给予温暖的回应</small>
        </div>
        <div class="chat-body" id="chat-body"></div>
        <div class="chat-foot">
            <div class="input-group">
                <input type="text" id="chat-input" class="form-control rounded-start-pill" placeholder="说说你的心情...">
                <button onclick="sendMsg()" class="btn btn-primary rounded-end-pill px-4">发送</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>

</html>
